<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البحر المضيء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04050c;
    --panel: #0b1128;
    --line: #2b3560;
    --fg: #ece6d8;
    --dim: #a3a8bf;
    --faint: #737993;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Noto Naskh Arabic", "Geeza Pro", "Segoe UI", "DejaVu Sans", serif;
    overflow: hidden;
  }
  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 115%, #101a3d 0%, #060914 55%, var(--bg) 100%);
    transition: opacity 1.2s ease;
  }
  #ui.hidden { opacity: 0; pointer-events: none; }
  h1 { margin: 0; font-weight: 600; font-size: clamp(34px, 8vw, 60px); line-height: 1.3; }
  p { margin: 0; max-width: 34em; line-height: 2; color: var(--dim); font-size: clamp(15px, 2.6vw, 19px); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 19px;
    padding: 12px 30px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  button:disabled { opacity: 0.4; cursor: default; }
  #note { font-size: 14px; color: var(--faint); min-height: 1.5em; }
  #hud {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 14px;
    z-index: 5;
    display: none;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    color: var(--dim);
    font-size: 14px;
  }
  #hud.on { display: flex; }
  #hud button { font-size: 14px; padding: 7px 16px; }
  canvas { display: block; touch-action: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>البحر المضيء</h1>
  <p>في ليالٍ على شواطئ مسقط يضيء البحر بلون فيروزي كلما تحرك الماء: عوالق صغيرة تومض حين تُضطرب. هنا كتلة واحدة حيّة من ذلك الضوء، سريعة كسرب سمك، تتمدد وتلتف وتنقسم وتلتئم، وكل حركة مفاجئة توقد فيها موجة. مدّ يدك إليها.</p>
  <div class="row">
    <button id="enter" class="primary" disabled>ادخل</button>
    <button id="preview">شاهد على الشاشة</button>
  </div>
  <p id="note"></p>
</div>
<div id="hud"><span id="clock"></span><button id="mute">إيقاف الصوت</button></div>
<script type="module" src="./main.js"></script>
</body>
</html>
