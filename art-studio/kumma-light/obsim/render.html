<!doctype html>
<html><head><meta charset="utf-8"><title>OB Sim</title>
<style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { ConvexGeometry } from './vendor/geometries/ConvexGeometry.js';
import { mergeVertices } from './vendor/utils/BufferGeometryUtils.js';
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 960), H = +(P.get('h') || 540);
const BG = P.get('bg') || 'night';
const LOG = await (await fetch(P.get('log'))).json();

// ---------- brushes (from the Open Brush descriptors) ----------
const SPEC = {
  'Marker':          {kind: 'flat', pmin: 0.1, blend: 'alpha', soft: 0.25},
  'Tapered Marker':  {kind: 'flat', pmin: 0.0, blend: 'alpha', soft: 0.25, taper: true},
  'Ink':             {kind: 'flat', pmin: 0.2, blend: 'alpha', soft: 0.35},
  'Felt':            {kind: 'flat', pmin: 0.2, blend: 'alpha', soft: 0.4},
  'Velvet Ink':      {kind: 'flat', pmin: 0.2, blend: 'alpha', soft: 0.5},
  'Light':           {kind: 'flat', pmin: 0.15, blend: 'add', soft: 0.9, gain: 1.4},
  'Soft Highlighter':{kind: 'flat', pmin: 0.0, blend: 'add', soft: 1.0, gain: 0.8},
  'Highlighter':     {kind: 'flat', pmin: 0.1, blend: 'add', soft: 0.5, gain: 0.7},
  'Neon Pulse':      {kind: 'flat', pmin: 0.5, blend: 'add', soft: 0.6, gain: 1.6},
  'Dr. Wigglez':     {kind: 'flat', pmin: 0.2, blend: 'alpha', soft: 0.5},
  'Dot Marker':      {kind: 'dots', pmin: 1, blend: 'alpha', soft: 0.15, spacing: 1.6},
  'Stars':           {kind: 'dots', pmin: 1, blend: 'add', soft: 1.0, spacing: 2.5, gain: 1.4},
  'Snow':            {kind: 'dots', pmin: 1, blend: 'add', soft: 1.0, spacing: 2.5},
  'Embers':          {kind: 'dots', pmin: 1, blend: 'add', soft: 1.0, spacing: 2.0},
  'Smoke':           {kind: 'dots', pmin: 1, blend: 'add', soft: 1.0, spacing: 1.2, gain: 0.25, big: 6},
};
Object.assign(SPEC, {
  'Shiny Hull':   {kind: 'hull', pmin: 0.1, mat: 'shiny'},
  'Matte Hull':   {kind: 'hull', pmin: 0.1, mat: 'matte'},
  'Unlit Hull':   {kind: 'hull', pmin: 0.1, mat: 'unlit'},
  'Diamond Hull': {kind: 'hull', pmin: 0.1, mat: 'shiny'},
  'Lofted':       {kind: 'tube', pmin: 0.0, mat: 'matte'},
  'Icing':        {kind: 'tube', pmin: 0.1, mat: 'matte'},
  'Faceted Tube': {kind: 'tube', pmin: 0.5, mat: 'unlit', sides: 6},
  'Tube Toon Inverted': {kind: 'tube', pmin: 0.1, mat: 'unlit'},
});
const specOf = b => SPEC[b] || {kind: 'flat', pmin: 0.2, blend: 'alpha', soft: 0.3};
// strokes drawn before a layer's CenterPivot are shifted like Open Brush does
for (const s of LOG.strokes) {
  const L = LOG.layers[s.layer];
  if (L && L.pivot && s.t <= L.pivotTime + 1e-6) for (const c of s.cps) { c[0] -= L.pivot[0]; c[1] -= L.pivot[1]; c[2] -= L.pivot[2]; }
}
function matFor(sp, color) {
  const col = new THREE.Color(color[0], color[1], color[2]);
  if (sp.mat === 'unlit') return new THREE.MeshBasicMaterial({color: col, side: THREE.DoubleSide});
  return new THREE.MeshStandardMaterial({color: col, roughness: sp.mat === 'shiny' ? 0.28 : 0.75, metalness: 0.0, side: THREE.DoubleSide});
}
const ICO = new THREE.IcosahedronGeometry(1, 0).getAttribute('position');
function hullMesh(s, sp) {                              // HullBrush: the convex hull of small spheres around the knots
  const pts = [];
  for (const c of s.cps) {
    const r = s.size * (sp.pmin + (1 - sp.pmin) * Math.min(1, Math.max(0, c[7]))) * 0.5;
    for (let i = 0; i < ICO.count; i += 2) pts.push(new THREE.Vector3(c[0] + ICO.getX(i) * r, c[1] + ICO.getY(i) * r, c[2] + ICO.getZ(i) * r));
  }
  if (pts.length < 4) return null;
  let g; try { g = new ConvexGeometry(pts); } catch (e) { return null; }
  g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g, 1e-4); g.computeVertexNormals();
  return new THREE.Mesh(g, matFor(sp, s.color));
}
function tubeMesh(s, sp) {                              // TubeBrush: rings around the path, radius from pressure
  const P = s.cps.map(c => new THREE.Vector3(c[0], c[1], c[2])); const n = P.length; if (n < 2) return null;
  const sides = sp.sides || 10, pos = [], idx = [];
  let normal = null;
  for (let i = 0; i < n; i++) {
    const tg = (i < n - 1 ? P[i + 1].clone().sub(P[i]) : P[i].clone().sub(P[i - 1])).normalize();
    if (!normal) { normal = new THREE.Vector3(0, 1, 0); if (Math.abs(normal.dot(tg)) > 0.9) normal.set(1, 0, 0); }
    normal = normal.clone().sub(tg.clone().multiplyScalar(normal.dot(tg))).normalize();
    const bin = new THREE.Vector3().crossVectors(tg, normal);
    const r = s.size * (sp.pmin + (1 - sp.pmin) * Math.min(1, Math.max(0, s.cps[i][7]))) * 0.5;
    for (let k = 0; k < sides; k++) {
      const a = k / sides * Math.PI * 2;
      const v = P[i].clone().addScaledVector(normal, Math.cos(a) * r).addScaledVector(bin, Math.sin(a) * r);
      pos.push(v.x, v.y, v.z);
    }
    if (i > 0) for (let k = 0; k < sides; k++) {
      const a = (i - 1) * sides + k, b = (i - 1) * sides + (k + 1) % sides, c = i * sides + k, d = i * sides + (k + 1) % sides;
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return new THREE.Mesh(g, matFor(sp, s.color));
}

// ---------- geometry like FlatGeometryBrush (ComputeSurfaceFrameNew) ----------
const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);
function inDirOf(pref, v) { return (pref.lengthSq() > 0 && pref.dot(v) < 0) ? v.clone().negate() : v.clone(); }
function flatStroke(s, sp, out) {
  const cps = s.cps, n = cps.length; if (n < 2) return;
  let prevRight = new THREE.Vector3();
  const pos = cps.map(c => v3(c));
  let cum = [0]; for (let i = 1; i < n; i++) cum.push(cum[i - 1] + pos[i].distanceTo(pos[i - 1]));
  const L = cum[n - 1] || 1;
  const base = out.nv;
  for (let i = 0; i < n; i++) {
    const c = cps[i];
    const q = new THREE.Quaternion(c[3], c[4], c[5], c[6]);
    let mv = (i < n - 1 ? pos[i + 1].clone().sub(pos[i]) : pos[i].clone().sub(pos[i - 1]));
    if (mv.lengthSq() < 1e-12) mv = new THREE.Vector3(0, 0, 1); mv.normalize();
    const F = new THREE.Vector3(0, 0, 1).applyQuaternion(q), U = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
    const r1 = inDirOf(prevRight, new THREE.Vector3().crossVectors(F, mv));
    const r2 = inDirOf(prevRight, new THREE.Vector3().crossVectors(U, mv)).multiplyScalar(Math.abs(F.dot(mv)));
    const right = r1.add(r2); if (right.lengthSq() < 1e-12) right.set(1, 0, 0); right.normalize();
    prevRight = right.clone();
    let w = s.size * (sp.pmin + (1 - sp.pmin) * Math.min(1, Math.max(0, c[7])));
    if (sp.taper) { const u = cum[i] / L; w *= Math.min(1, Math.min(u, 1 - u) / 0.12 + 0.05); }
    const hw = w / 2;
    for (const sgn of [-1, 1]) {
      const p = pos[i].clone().addScaledVector(right, sgn * hw);
      out.pos.push(p.x, p.y, p.z); out.col.push(...s.color); out.uv.push(sgn < 0 ? 0 : 1, 0); out.vid.push(out.nv++);
    }
    if (i > 0) { const a = base + 2 * (i - 1); out.idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
}
function dotStroke(s, sp, out) {                      // spray / particles: little discs along the stroke
  const cps = s.cps; if (cps.length < 2) return;
  const size = s.size * (sp.big || 1);
  const step = Math.max(s.size * sp.spacing, 1e-3);
  let carry = 0;
  for (let i = 0; i < cps.length - 1; i++) {
    const a = v3(cps[i]), b = v3(cps[i + 1]); const d = a.distanceTo(b);
    for (let x = carry; x < d; x += step) {
      const p = a.clone().lerp(b, d > 0 ? x / d : 0);
      const base = out.nv;
      for (const [u, v] of [[0, 0], [1, 0], [1, 1], [0, 1]]) {
        out.pos.push(p.x, p.y, p.z); out.col.push(...s.color); out.uv.push(u, v); out.vid.push(out.nv++);
        out.corner.push((u - 0.5) * size, (v - 0.5) * size);
      }
      out.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
    carry = (carry - d) % step; if (carry < 0) carry += step;
  }
}

// ---------- batches: one per (layer, brush), strokes appended in creation order ----------
const layers = new Map();      // id -> {group, batches: Map brush -> batch}
const scene = new THREE.Scene();
function layerObj(id) {
  if (!layers.has(id)) { const g = new THREE.Group(); scene.add(g); layers.set(id, {group: g, batches: new Map()}); }
  return layers.get(id);
}
const VS = `
  attribute vec3 color; attribute float vid; attribute vec2 corner;
  varying vec3 vCol; varying float vVid; varying vec2 vUv;
  uniform float uDots;
  void main(){
    vCol = color; vVid = vid; vUv = uv;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    if (uDots > 0.5) { float sc = length(modelMatrix[0].xyz); mv.xy += corner * sc; }
    gl_Position = projectionMatrix * mv;
  }`;
const FS = `
  varying vec3 vCol; varying float vVid; varying vec2 vUv;
  uniform float uClipStart, uClipEnd, uDissolve, uSoft, uGain, uDots, uAdd;
  float bayer(vec2 p){ ivec2 i = ivec2(mod(p, 8.0)); int m[64] = int[64](0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21); return float(m[i.y*8+i.x])/64.0; }
  void main(){
    if (uClipEnd > 0.0 && !(vVid > uClipStart && vVid < uClipEnd)) discard;
    if (uDissolve < 1.0 && bayer(gl_FragCoord.xy) >= uDissolve) discard;
    float a;
    if (uDots > 0.5) { float d = length(vUv - 0.5) * 2.0; a = 1.0 - smoothstep(1.0 - uSoft, 1.0, d); if (a <= 0.01) discard; }
    else { float d = abs(vUv.x - 0.5) * 2.0; a = 1.0 - smoothstep(1.0 - uSoft, 1.0, d); }
    if (uAdd > 0.5) gl_FragColor = vec4(vCol * a * uGain, 1.0);
    else { if (a < 0.5) discard; gl_FragColor = vec4(vCol, 1.0); }
  }`;
function buildBatches() {
  const tmp = new Map();
  LOG.strokes.forEach((s, k) => {
    const sp0 = specOf(s.brush);
    if (sp0.kind === 'hull' || sp0.kind === 'tube') {
      const m = sp0.kind === 'hull' ? hullMesh(s, sp0) : tubeMesh(s, sp0);
      if (m) { m.frustumCulled = false; m.userData.t = s.t; layerObj(s.layer).group.add(m); layerObj(s.layer).solids = (layerObj(s.layer).solids || []); layerObj(s.layer).solids.push(m); }
      return;
    }
    const key = s.layer + '|' + s.brush;
    if (!tmp.has(key)) tmp.set(key, {layer: s.layer, brush: s.brush, out: {pos: [], col: [], uv: [], vid: [], idx: [], corner: [], nv: 0}, marks: []});
    const b = tmp.get(key), sp = specOf(s.brush);
    (sp.kind === 'dots' ? dotStroke : flatStroke)(s, sp, b.out);
    b.marks.push([s.t, b.out.nv, b.out.idx.length]);
  });
  for (const b of tmp.values()) {
    const sp = specOf(b.brush), o = b.out;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(o.pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(o.col, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(o.uv, 2));
    g.setAttribute('vid', new THREE.Float32BufferAttribute(o.vid, 1));
    g.setAttribute('corner', new THREE.Float32BufferAttribute(o.corner.length ? o.corner : new Array(o.nv * 2).fill(0), 2));
    g.setIndex(o.idx);
    const m = new THREE.ShaderMaterial({vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
      uniforms: {uClipStart: {value: 0}, uClipEnd: {value: -1}, uDissolve: {value: 1}, uSoft: {value: sp.soft},
                 uGain: {value: sp.gain || 1}, uDots: {value: sp.kind === 'dots' ? 1 : 0}, uAdd: {value: sp.blend === 'add' ? 1 : 0}},
      transparent: sp.blend === 'add', depthWrite: sp.blend !== 'add',
      blending: sp.blend === 'add' ? THREE.AdditiveBlending : THREE.NormalBlending});
    const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false;
    layerObj(b.layer).group.add(mesh);
    layerObj(b.layer).batches.set(b.brush, {mesh, marks: b.marks});
  }
}
buildBatches();

// ---------- background ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), new THREE.ShaderMaterial({side: THREE.BackSide, depthWrite: false,
  uniforms: {night: {value: BG === 'night' ? 1 : 0}},
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vP; uniform float night; void main(){
    float y = vP.y;
    vec3 nTop = vec3(0.05,0.045,0.09), nHor = vec3(0.17,0.15,0.22), nLow = vec3(0.06,0.055,0.07);
    vec3 dTop = vec3(0.93,0.91,0.87), dHor = vec3(0.97,0.95,0.92), dLow = vec3(0.85,0.83,0.8);
    vec3 top = mix(dTop, nTop, night), hor = mix(dHor, nHor, night), low = mix(dLow, nLow, night);
    vec3 c = y > 0.0 ? mix(hor, top, pow(y, 0.6)) : mix(hor, low, pow(-y, 0.4));
    gl_FragColor = vec4(c, 1.0); }`}));
scene.add(sky);
// a floor grid far below, like a room reference
const floor = new THREE.GridHelper(400, 40, BG === 'night' ? 0x2a2638 : 0xc9c4ba, BG === 'night' ? 0x1d1a28 : 0xd9d4cb);
floor.position.y = 0; scene.add(floor);

// ---------- lights (the sketch's lights if the plugin set them) ----------
const LG = LOG.lights || {};
const toCol = c => c ? new THREE.Color(c[0], c[1], c[2]) : null;
scene.add(new THREE.AmbientLight(toCol(LG.ambient) || new THREE.Color(0.35, 0.33, 0.4), 1.4));
function dirLight(c, q, inten, fallback) {
  const L = new THREE.DirectionalLight(toCol(c) || new THREE.Color(1, 1, 1), inten);
  const f = q ? new THREE.Vector3(0, 0, 1).applyQuaternion(new THREE.Quaternion(q[0], q[1], q[2], q[3])) : fallback;
  L.position.copy(f.clone().multiplyScalar(-1000)); L.target.position.set(0, 0, 0); scene.add(L); scene.add(L.target);
}
dirLight(LG.main, LG.mainRot, 2.6, new THREE.Vector3(0.3, -0.8, 0.5).normalize());
dirLight(LG.second, LG.secondRot, 1.2, new THREE.Vector3(-0.4, 0.3, -0.8).normalize());

// ---------- camera at the user's head ----------
const M = LOG.meta;
const camera = new THREE.PerspectiveCamera(+(P.get('fov') || 80), W / H, 0.05, 9000);
// look at the middle of where the layers are (over the second half of the run), else at the strokes
const allP = [];
for (const S of LOG.samples.slice(LOG.samples.length >> 1)) for (const r of S.L) if (r[9] > 0.5 && r[8] > 0.05) allP.push([r[1], r[2], r[3]]);
if (!allP.length) LOG.strokes.forEach(s => { if (s.cps.length) allP.push(s.cps[0]); });
const med = k => { const a = allP.map(p => p[k]).sort((x, y) => x - y); return a.length ? a[a.length >> 1] : 0; };
const look = new THREE.Vector3(med(0), med(1), med(2));
const head = v3(M.head);
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);

// ---------- one frame ----------
const samples = LOG.samples;
function sampleAt(t) { let lo = 0, hi = samples.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (samples[m].t <= t) lo = m; else hi = m - 1; } return samples[lo]; }
window.renderAt = (t, orbit) => {
  const S = sampleAt(t);
  const state = new Map(); for (const r of S.L) state.set(r[0], r);
  for (const [id, L] of layers) {
    const r = state.get(id);
    const deleted = LOG.layers[id] && LOG.layers[id].deleted !== null && LOG.layers[id].deleted <= t;
    if (!r || deleted) { L.group.visible = false; continue; }
    L.group.visible = r[9] > 0.5;
    L.group.position.set(r[1], r[2], r[3]); L.group.quaternion.set(r[4], r[5], r[6], r[7]); L.group.scale.setScalar(r[8]);
    for (const m of (L.solids || [])) m.visible = m.userData.t <= t + 1e-6;
    for (const b of L.batches.values()) {
      let nv = 0, ni = 0; for (const mk of b.marks) { if (mk[0] <= t + 1e-6) { nv = mk[1]; ni = mk[2]; } else break; }
      b.mesh.geometry.setDrawRange(0, ni); b.mesh.visible = ni > 0;
      const u = b.mesh.material.uniforms;
      if (r[11] > 0) { u.uClipStart.value = r[10] * nv; u.uClipEnd.value = r[11] * nv; } else { u.uClipEnd.value = -1; }
      u.uDissolve.value = r[12];
    }
  }
  const sway = 0.15 * Math.sin(t * 0.7);
  if (orbit) {
    const d = head.clone().sub(look); const ang = orbit * Math.sin(t * 0.12);
    d.applyAxisAngle(new THREE.Vector3(0, 1, 0), ang); camera.position.copy(look).add(d);
  } else camera.position.set(head.x + sway, head.y + 0.1 * Math.sin(t * 0.5), head.z);
  camera.lookAt(look);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
window.info = {strokes: LOG.strokes.length, look: look.toArray(), head: head.toArray(), messages: LOG.events.filter(e => e.kind === 'message').map(e => e.text)};
window.ready = true;
</script></body></html>
